name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: healthupgrades_test
          POSTGRES_USER: healthupgrades
          POSTGRES_PASSWORD: healthupgrades
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # `verify` compiles, runs the unit tests, runs the *IT integration tests against the Postgres
      # service above, and packages the jar. Splitting those into separate `mvn` invocations only
      # recompiled the same sources repeatedly.
      - name: Build, test and verify backend
        run: cd backend && mvn -B --no-transfer-progress clean verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/healthupgrades_test
          DB_USERNAME: healthupgrades
          DB_PASSWORD: healthupgrades
          JWT_SECRET: test-secret-key-for-ci-at-least-256-bits-long-random-string-here

      # There is deliberately no backend vulnerability audit yet: OWASP dependency-check cannot populate
      # its database without an NVD API key and fails outright without one. See the known gaps in
      # ADR-002 for what enabling it requires.

  frontend:
    name: Frontend - Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint frontend
        run: cd frontend && npm run lint

      # Scoped to what ships. Auditing the dev tree here would redden every unrelated PR whenever an
      # advisory lands against the Vite or ESLint toolchain, none of which reaches a user's browser.
      - name: Audit shipped frontend dependencies for known vulnerabilities
        run: cd frontend && npm audit --omit=dev --audit-level=high

      - name: Build frontend
        run: cd frontend && npm run build
