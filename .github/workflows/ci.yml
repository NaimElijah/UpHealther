name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Checkout is the only step that touches the repository, and it only reads. The repository's default
# token is read-only already, but that is a setting outside the tree; this keeps the restriction with
# the workflow and narrows it to the one scope. Artifact uploads and the dependency caches use the
# runner's own token, not this one.
permissions:
  contents: read

# Each job's `name:` below is a required check of ruleset 25310599, "CI must pass", which binds every
# merge into main and dev, the admin's included (ADR-043). A required check that never reports leaves a
# PR waiting, so renaming, adding or removing a job means editing that ruleset just before merging the
# PR that does it, then pushing to or closing and reopening the other open PRs so they report the new
# names; a re-run reuses the old merge ref.
jobs:
  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    # No `services:` block. The integration tests start their own PostgreSQL through Testcontainers, so
    # the database is described in the test source rather than in the runner's configuration and the
    # same `./mvnw verify` runs identically here and on a developer machine. See ADR-008 and ADR-030.

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Each job runs its part of the gate through the root package.json, the script `npm test` runs
      # locally, so both apply the same checks (ADR-044). Node is only the entry point here: no cache,
      # since the root installs nothing.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      # `verify` compiles, runs the unit tests, runs the *IT integration tests against a PostgreSQL
      # container they start themselves, packages the jar, and last checks the Java layout (ADR-037).
      # Splitting those into separate `mvn` invocations only recompiled the same sources repeatedly.
      # Then OSV-Scanner audits the resolved dependency tree and fails on any known vulnerability, in a
      # container of its own with no token (ADR-047). The step's name is free to change; the job's is
      # the required check.
      - name: Build, test, verify and audit backend
        run: npm run test:backend

      # Coverage is reported, never gated — a threshold is satisfied by tests written to move a number
      # and says nothing about whether a requirement is enforced (ADR-009). Printed into the job summary
      # so it is visible without downloading anything, and listing the packages at zero, because that is
      # the part worth acting on. Reads JaCoCo's CSV rather than its XML: same numbers, no XML parser.
      - name: Summarise backend coverage
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          import sys
          from collections import defaultdict
          from pathlib import Path

          # This step runs on failure too (`if: always()`), and a build that dies before jacoco:report
          # leaves no CSV behind — `clean` has already removed target/. Degrade rather than add a second
          # red step that has nothing to do with why the build failed.
          report = Path('backend/target/site/jacoco/jacoco.csv')
          if not report.exists():
              print('### Backend coverage\n\n_No report — the build did not reach it._')
              sys.exit(0)

          with report.open(newline='') as handle:
              rows = list(csv.DictReader(handle))

          def totals(subset, kind):
              covered = sum(int(r[f'{kind}_COVERED']) for r in subset)
              total = covered + sum(int(r[f'{kind}_MISSED']) for r in subset)
              return covered, total, (0 if not total else round(100 * covered / total))

          print('### Backend coverage\n')
          print('| Metric | Covered | % |')
          print('|---|---|---|')
          for kind in ('LINE', 'BRANCH', 'INSTRUCTION'):
              covered, total, percent = totals(rows, kind)
              print(f'| {kind.title()} | {covered}/{total} | {percent}% |')

          by_package = defaultdict(list)
          for row in rows:
              by_package[row['PACKAGE']].append(row)
          empty = sorted(
              name.replace('com.healthupgrades.', '')
              for name, package_rows in by_package.items()
              if totals(package_rows, 'LINE')[1] and totals(package_rows, 'LINE')[2] == 0
          )
          print('\nPackages with no line coverage:\n')
          print('\n'.join(f'- `{name}`' for name in empty) or '_none_')
          PY

      - name: Upload the backend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 14

  diagrams:
    name: Diagrams - Drift check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      # Three of the diagrams in docs/architecture/arch-diagrams/ are derived from the imports, the
      # package layout and the migrations. Regenerating here and failing on a difference is what stops
      # them describing an architecture the code no longer has — the failure ADR-002 was written about.
      - name: Check the generated diagrams still match the source
        run: npm run test:diagrams

  frontend:
    name: Frontend - Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm run setup

      # One step, because it is the same list `npm test` runs locally. ADR-044 says why each check is in
      # it, and in that order. npm prints a `> ` banner before each script it runs, so the last one above
      # the error names the check that failed. The audit is the exception: it is npm's own command, not a
      # script, so it prints `# npm audit report` instead, straight after the tests' banner.
      - name: Check, test, audit and build frontend
        run: npm run test:frontend

      - name: Upload the frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  images:
    name: Images - Build & Start
    runs-on: ubuntu-latest
    # The job most exposed to a hang: both images download every Maven and npm dependency over the
    # network with no layer cache, and `--wait-timeout` bounds only the start. A hung required check
    # would hold a PR for the default 360 minutes, the case ADR-043 said to revisit. See ADR-045.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      # Builds both images from their Dockerfiles, starts the stack, and waits until every service is
      # healthy: the backend ready once Flyway has migrated an empty database, nginx serving with
      # nginx.conf loaded. On failure the stack's logs are printed, and it is always taken down.
      - name: Build both images and start the stack from them
        run: npm run test:images
