name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: healthupgrades_test
          POSTGRES_USER: healthupgrades
          POSTGRES_PASSWORD: healthupgrades
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend
        run: cd backend && mvn clean compile -q

      - name: Run backend tests
        run: cd backend && mvn test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/healthupgrades_test
          DB_USERNAME: healthupgrades
          DB_PASSWORD: healthupgrades
          JWT_SECRET: test-secret-key-for-ci-at-least-256-bits-long-random-string-here

      - name: Package backend
        run: cd backend && mvn package -DskipTests -q

  frontend:
    name: Frontend - Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint frontend
        run: cd frontend && npm run lint || true

      - name: Build frontend
        run: cd frontend && npm run build
