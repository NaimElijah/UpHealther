# Hides the nginx version from every response and error page. It tells an attacker which advisories to
# read and tells a user nothing at all.
server_tokens off;

# Throttles /ws, per client address (S5.C4). Its handshake is open to anyone, and the backend logs a
# refused frame and an undecodable one at ERROR, so without a limit an anonymous client could write
# ERROR lines as fast as it could open sockets. limit_req counts handshakes, not the frames on an open
# socket; limit_conn counts the sockets open at once.
#
# A normal client is well inside both. A tab holds one socket, and while the socket is down it reconnects
# every five seconds: twelve handshakes a minute (api/notificationSocket.ts).
#   rate=60r/m, burst=20   Five tabs reconnecting without pause stay under the rate, and the burst lets
#                          twenty tabs reconnect at once after the backend restarts, without waiting.
#   20 sockets             Twenty tabs open at once on one address, a household behind one router among
#                          them.
# Over either limit is answered 429, which the tab's next attempt five seconds later retries.
#
# $binary_remote_addr is the address in its 4- or 16-byte form, so an IPv6 client is counted per address,
# not per /64 as the backend's own limiter counts it (NFR-43), and one that rotates addresses within its
# allocation gets a fresh allowance for each. Through the compose stack's loopback port, Docker usually
# delivers every connection from its gateway's address, so local tabs share both limits. One megabyte holds
# about sixteen thousand addresses for limit_req and twice that for limit_conn.
limit_req_zone $binary_remote_addr zone=ws_handshakes:1m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=ws_sockets:1m;

server {
    listen 80;

    # Security headers, on every response this server sends.
    #
    # `always` on every one of them, and it is not decoration: without it nginx omits the header on
    # error responses, so the 404 and 5xx pages — the ones most likely to be rendering something
    # unexpected — would ship with no policy at all.
    #
    # Declared on the server, not on `location /`, so that nginx's own error pages under /api and /ws
    # carry them too: a 502 while the backend restarts, a 413 for a body over the size limit, a 429 from
    # the /ws throttle (S5.C12). nginx copies the server's add_header into a location only when that
    # location declares none of its own, so no location may declare one: a single add_header there
    # would drop all of these from it. frontend/src/test/nginxConf.test.ts holds both rules.
    #
    # These are set here rather than in Spring because they are properties of the *page*. Spring
    # already sends nosniff and frame options on /api, where they protect the JSON, so a proxied
    # response carries those two twice, with the same value.

    # Content Security Policy. The interesting parts:
    #
    #   script-src 'self' 'sha256-…'  The hash is the pre-paint theme script in index.html, which
    #                                 must be inline to run before the first paint. A hash permits
    #                                 that one script and nothing else — 'unsafe-inline' would
    #                                 permit every injected script too, which is the whole attack.
    #                                 frontend/src/test/bootScriptCsp.test.ts recomputes this hash
    #                                 from the shipped file and fails the build if it drifts.
    #   connect-src 'self' ws://$http_host wss://$http_host
    #                                 The SPA opens a STOMP socket to /ws on the host the page was
    #                                 requested from. The socket's URL is named, not left to 'self',
    #                                 because whether 'self' covers a ws: or wss: URL is not settled
    #                                 across the browsers the SPA supports (#250). $http_host is the
    #                                 Host header as the browser sent it, port included, which $host
    #                                 would drop; so the policy needs no edit between localhost:3000
    #                                 and a real domain. It names the host the request claims, which
    #                                 matters only to a cache that ignores Host, and none sits in
    #                                 front; #209 revisits this once the deployment has a fixed origin.
    #   object-src 'none'             No plugins. Nothing here uses them and <object> is a classic
    #                                 injection sink.
    #   base-uri 'self'               Stops an injected <base> silently repointing every relative
    #                                 URL on the page, including the bundle.
    #   frame-ancestors 'none'        Not embeddable, which is what actually stops clickjacking;
    #                                 X-Frame-Options below is the same rule for older browsers.
    #
    # No 'unsafe-inline' and no 'unsafe-eval' anywhere. Tailwind ships a real stylesheet and the
    # bundle is a module, so neither is needed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-hXkQCMbZjNPedKcp4RbGWbZuLB4GJJpdNq39HTNUdKI='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Do not guess a content type from the bytes. Without this a file served as text/plain that
    # happens to look like script can be executed as one.
    add_header X-Content-Type-Options "nosniff" always;

    # The older, coarser form of frame-ancestors, for browsers that do not implement CSP Level 2.
    add_header X-Frame-Options "DENY" always;

    # Send the full URL as a referrer only within this origin; send the origin alone elsewhere. A
    # path here can name a health area or an upgrade, which is the user's own words about their
    # health and has no business appearing in a third party's logs.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nothing here uses a camera, a microphone or a location, so nothing may ask.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Names UTF-8 on the text this location serves, THIRD-PARTY-NOTICES.txt among it: the licence
        # texts are copied verbatim, so a © or a non-Latin name would otherwise render as mojibake. Set
        # here, not on the server, so the proxied /api and /ws responses keep the type they arrived with.
        charset utf-8;
    }

    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for. The latter appends the real client to
        # whatever the caller already sent, so a request arriving with a forged X-Forwarded-For
        # reaches the backend with the forgery still in front - and Tomcat reads the leftmost
        # untrusted hop as the client. Overwriting the header is what makes the rate limit count
        # an address the caller cannot choose.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Set here for the same reason: Tomcat believes the host and port nginx forwards, and a header
        # left unset here would reach it as the caller wrote it, so the caller would pick the address
        # the API believes it was reached on.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # The caller's trace context is dropped, in both formats the backend consumes: W3C (`traceparent`,
        # `tracestate`, `baggage`) and B3 (`b3`, and the multi-header `X-B3-*`). An empty value makes
        # nginx send no header. The backend continues an inbound trace, so a caller who sent one would
        # choose the trace id its log lines and audit entries join on (S5.C5). Every request starts a
        # trace of its own at the API instead. The backend also narrows what the API consumes, so this
        # is not the only line of defence.
        proxy_set_header traceparent "";
        proxy_set_header tracestate "";
        proxy_set_header baggage "";
        proxy_set_header b3 "";
        proxy_set_header X-B3-TraceId "";
        proxy_set_header X-B3-SpanId "";
        proxy_set_header X-B3-ParentSpanId "";
        proxy_set_header X-B3-Sampled "";
        proxy_set_header X-B3-Flags "";
    }

    # WebSocket endpoint for real-time notifications — must upgrade the connection.
    location /ws {
        limit_req zone=ws_handshakes burst=20 nodelay;
        limit_conn ws_sockets 20;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header traceparent "";
        proxy_set_header tracestate "";
        proxy_set_header baggage "";
        proxy_set_header b3 "";
        proxy_set_header X-B3-TraceId "";
        proxy_set_header X-B3-SpanId "";
        proxy_set_header X-B3-ParentSpanId "";
        proxy_set_header X-B3-Sampled "";
        proxy_set_header X-B3-Flags "";
        proxy_read_timeout 3600s;
    }
}
