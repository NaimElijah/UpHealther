# Hides the nginx version from every response and error page. It tells an attacker which advisories to
# read and tells a user nothing at all.
server_tokens off;

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Security headers for the document itself.
        #
        # `always` on every one of them, and it is not decoration: without it nginx omits the header on
        # error responses, so the 404 and 5xx pages — the ones most likely to be rendering something
        # unexpected — would ship with no policy at all.
        #
        # These are set here rather than in Spring because they are properties of the *page*. Spring
        # already sends nosniff and frame options on /api, where they protect the JSON.

        # Content Security Policy. The interesting parts:
        #
        #   script-src 'self' 'sha256-…'  The hash is the pre-paint theme script in index.html, which
        #                                 must be inline to run before the first paint. A hash permits
        #                                 that one script and nothing else — 'unsafe-inline' would
        #                                 permit every injected script too, which is the whole attack.
        #                                 frontend/src/test/bootScriptCsp.test.ts recomputes this hash
        #                                 from the shipped file and fails the build if it drifts.
        #   connect-src 'self' ws: wss:   The SPA opens a STOMP socket to /ws on its own origin.
        #                                 $http_host rather than a literal, so this works on localhost
        #                                 and on a real domain without being edited.
        #   object-src 'none'             No plugins. Nothing here uses them and <object> is a classic
        #                                 injection sink.
        #   base-uri 'self'               Stops an injected <base> silently repointing every relative
        #                                 URL on the page, including the bundle.
        #   frame-ancestors 'none'        Not embeddable, which is what actually stops clickjacking;
        #                                 X-Frame-Options below is the same rule for older browsers.
        #
        # No 'unsafe-inline' and no 'unsafe-eval' anywhere. Tailwind ships a real stylesheet and the
        # bundle is a module, so neither is needed.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-hXkQCMbZjNPedKcp4RbGWbZuLB4GJJpdNq39HTNUdKI='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # Do not guess a content type from the bytes. Without this a file served as text/plain that
        # happens to look like script can be executed as one.
        add_header X-Content-Type-Options "nosniff" always;

        # The older, coarser form of frame-ancestors, for browsers that do not implement CSP Level 2.
        add_header X-Frame-Options "DENY" always;

        # Send the full URL as a referrer only within this origin; send the origin alone elsewhere. A
        # path here can name a health area or an upgrade, which is the user's own words about their
        # health and has no business appearing in a third party's logs.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Nothing here uses a camera, a microphone or a location, so nothing may ask.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    }

    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for. The latter appends the real client to
        # whatever the caller already sent, so a request arriving with a forged X-Forwarded-For
        # reaches the backend with the forgery still in front - and Tomcat reads the leftmost
        # untrusted hop as the client. Overwriting the header is what makes the rate limit count
        # an address the caller cannot choose.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoint for real-time notifications — must upgrade the connection.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
