# How git-cliff writes CHANGELOG.md from the Conventional Commits between release tags. It runs from
# scripts/compose.changelog.yml, as `npm run changelog -- --tag vX.Y.Z`; the README's Releasing
# section has the whole procedure. See
# docs/ADRs/ADR-051-a-release-is-a-tag-on-its-promotion-and-git-cliff-writes-its-changelog.md.

[changelog]
# Plain text with no template variables: `--prepend` finds the old header by its exact text and drops
# it, so the file keeps one header however many releases are prepended under it. Changing it means
# changing the header already in CHANGELOG.md to match, in the same commit.
header = """
# Changelog

Every release of UpHealther, newest first. Each section is generated by
[git-cliff](https://git-cliff.org) from the Conventional Commits that release adds. GitHub's merge
commits are left out, and so are the formatting commits `.git-blame-ignore-revs` lists and any commit
that only edits that list. How a release is cut is in the README's Releasing section.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
# Not trimmed: trimming also strips the blank line between the header and the first section.
trim = false

[git]
conventional_commits = true
# Eight commits follow no convention, none of them later than 2026-08-19, and a merge commit's subject
# is GitHub's own.
# git-cliff also drops, without being asked, every commit .git-blame-ignore-revs lists, which are the
# formatter runs, and every commit that only edits that file, whatever kind of commit it is. Upstream
# tracks the second as a bug (orhun/git-cliff#1643). It is accepted, because such a commit changes
# nothing but the list.
filter_unconventional = true
# A commit type no parser below names fails the run rather than vanishing from the changelog.
fail_on_unmatched_commit = true
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The HTML comments order the sections; `striptags` removes them from the headings.
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Tests" },
    { message = "^build", group = "<!-- 6 -->Build" },
    { message = "^ci", group = "<!-- 7 -->CI" },
    { message = "^style", group = "<!-- 8 -->Style" },
    { message = "^(chore|revert)", group = "<!-- 9 -->Other" },
]
