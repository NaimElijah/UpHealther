# Layered over docker-compose.yml by scripts/check-images.mjs, and by nothing else.
#
# The check publishes one host port: the frontend's, for the browser suite in e2e/ (#167). Compose's
# health-checks run inside the containers and need none, and every other published port would make the
# check fail wherever something on the host already holds 5432 or 8080. `!reset` drops the base file's
# list instead of adding to it, which is what a plain `ports:` here would do. See
# docs/ADRs/ADR-045-ci-builds-and-starts-both-images.md.
#
# The frontend keeps 3000, because http://localhost:3000 is the only origin the stack accepts and the
# only host where a browser keeps the Secure refresh cookie over HTTP (ADR-041). It is bound to the
# loopback address only, so the stack is never reachable from the network. The base file binds the
# same address today; `!override` restates it so the check stays on loopback whatever the base file
# says, replacing its binding rather than adding a second one beside it. It needs Compose 2.24.4 or
# later. See docs/ADRs/ADR-052-a-playwright-smoke-suite-drives-the-stack-the-image-check-starts.md.
services:
  postgres:
    ports: !reset []
  backend:
    ports: !reset []
  frontend:
    ports: !override ['127.0.0.1:3000:80']
