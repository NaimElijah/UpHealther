server:
  port: 8080
  # Let Tomcat read X-Forwarded-* so getRemoteAddr() is the client's address rather than the
  # proxy's. Without this every request behind nginx shares one address and the rate limit below
  # counts the whole internet as a single client.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Which hops may be believed. Boot's default trusts all of 10/8, 172.16/12 and 192.168/16 -
      # and 172.16/12 contains the default Docker bridge gateway, so with the default any caller
      # reaching the published :8080 directly could set X-Forwarded-For and be counted as whatever
      # address it liked. Narrowed to nginx's own address on the compose network.
      internal-proxies: ${TRUSTED_PROXIES:172\.28\.0\.2}

spring:
  # Names the service in OpenTelemetry (service.name) and prefixes every log line. Without it a trace
  # is attributed to "unknown_service".
  application:
    name: health-upgrades-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthupgrades}
    username: ${DB_USERNAME:healthupgrades}
    password: ${DB_PASSWORD:healthupgrades}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities against it and refuses to start on a
      # mismatch. An entity change therefore needs a new V{n}__*.sql migration, never a schema update here.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # Lets Flyway adopt a database that already has tables but no schema history, so an environment
    # created before Flyway was introduced does not have to be dropped.
    baseline-on-migrate: true
  jackson:
    deserialization:
      # Jackson's default truncates a JSON fraction bound to an integer field, so a rating of 3.7 was
      # stored as 3 after passing @Min/@Max (BR-19, #240). Off, the body is refused as malformed (400).
      # ADR-033.
      accept-float-as-int: false

app:
  jwt:
    # Required, and deliberately without a usable default: a deployment that forgets JWT_SECRET refuses
    # to start instead of signing every token with a key published in this repository (ADR-042). The
    # empty default makes that a "must not be blank" on app.jwt.secret; a bare ${JWT_SECRET} would bind
    # its own text. A run from a checkout gets a development key from backend/config/application.yml.
    # At least 256 bits, or the application refuses to start.
    secret: ${JWT_SECRET:}
    # How long an access token is accepted. Short on purpose: it is held in the tab's memory and
    # renewed from the refresh cookie without the user noticing, so this is the window in which a
    # leaked token is worth anything - not the length of a session. Between 1m and 1h, or the
    # application refuses to start (JwtProperties).
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    # Written into every token and required back. A token minted by another service that happens to share
    # the secret is refused because its issuer or audience differs.
    issuer: healthupgrades
    audience: healthupgrades-web
    # How far past its expiry a token is still accepted, for hosts whose clocks disagree slightly.
    clock-skew: 30s
  auth:
    session:
      # A session lapses if it goes unused for this long. Each refresh slides it forward, so a
      # session in daily use never lapses.
      idle: ${AUTH_SESSION_IDLE:7d}
      # ...and no session outlives this, however often it is refreshed. The two together mean
      # neither an abandoned session nor a busy one can live indefinitely.
      absolute: ${AUTH_SESSION_ABSOLUTE:30d}
      # How long after a rotation the superseded credential counts as merely stale (409, retry)
      # rather than replayed (session revoked). Two tabs waking together legitimately present the
      # same credential within a moment; nothing legitimate does so ten seconds later.
      # Bounded at startup, as idle and absolute are (AuthSessionProperties): idle at least 1h and at
      # most absolute, absolute between 1h and 90d, the grace at most 1m.
      rotation-grace: ${AUTH_SESSION_ROTATION_GRACE:10s}
    cookie:
      # The __Secure- prefix makes a browser refuse the cookie unless it is set with Secure from a
      # secure origin, so a plain-HTTP host cannot plant one (S5.A8). __Host- would also forbid Domain,
      # but it requires Path=/, which would send the credential with every API call.
      name: __Secure-refresh_token
      # Narrow on purpose: the credential is then not attached to ordinary API calls at all.
      path: /api/auth
      # No security attribute is configurable: the cookie is always HttpOnly, Secure and
      # SameSite=Strict (RefreshCookies, ADR-041).
    schedules:
      # Sweep that deletes sessions nothing can use again. Correctness does not depend on it -
      # an expired session is refused by its own timestamps - so it runs when nothing else does.
      session-cleanup: ${AUTH_SESSION_CLEANUP_CRON:0 30 3 * * *}
  rate-limit:
    # Attempts per client address per window on sign-in and registration. Ten a minute is far more
    # than a person mistyping a password ever needs, and far less than a credential-stuffing run
    # finds worth attempting from one address.
    limit: ${AUTH_RATE_LIMIT:10}
    window: ${AUTH_RATE_LIMIT_WINDOW:1m}
    # The map is keyed by the caller's address, so it is capped: without one, addresses seen once
    # accumulate until the heap runs out, turning a defence into a different denial of service.
    max-tracked-clients: ${AUTH_RATE_LIMIT_MAX_CLIENTS:10000}
  session-rate-limit:
    # Attempts per client address per window on refresh and sign-out, together, in a bucket of their
    # own (S5.A11). Neither takes a password, but each one is audited. Sixty a minute leaves a household
    # behind one address room for every tab's renewal and every page load's, and holds an anonymous
    # caller to one audit entry a second.
    limit: ${AUTH_SESSION_RATE_LIMIT:60}
    window: ${AUTH_SESSION_RATE_LIMIT_WINDOW:1m}
    max-tracked-clients: ${AUTH_SESSION_RATE_LIMIT_MAX_CLIENTS:10000}
  admin:
    # The account promoted to ADMIN at startup, so a fresh installation has a way in. An account id,
    # never an email: registration is open, so naming an address would hand the installation to
    # whoever registered it first. It acts only while no administrator exists at all, so leaving it
    # set does not re-promote anybody after a deliberate demotion.
    bootstrap-user-id: ${ADMIN_BOOTSTRAP_USER_ID:}
  cors:
    # Comma-separated list of origins allowed to call the API directly (cross-origin).
    # Not needed when the frontend is served behind the Vite dev proxy or nginx (same-origin /api).
    # Also used as the allowed origins for the WebSocket (/ws) handshake.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  upgrades:
    schedules:
      # Cron expression for the scan that detects overdue upgrades, read in UTC (ServerZone, ADR-020).
      # NOTIFY_OVERDUE_CRON is the name this job used before it moved to the upgrade context; it is still
      # honoured so an existing deployment does not silently lose its override and revert to the default.
      overdue: ${UPGRADE_OVERDUE_CRON:${NOTIFY_OVERDUE_CRON:0 0 8 * * *}} # daily at 08:00
  notifications:
    schedules:
      # Cron expressions for the delayed-notification jobs, read in UTC (ServerZone, ADR-020).
      daily-checkin: ${NOTIFY_CHECKIN_CRON:0 0 18 * * *} # daily at 18:00 — check-in nudge
      reminders: ${NOTIFY_REMINDERS_CRON:0 * * * * *}    # every minute — user reminder dispatch

management:
  endpoints:
    web:
      exposure:
        # Explicit and closed. Boot's default exposes health alone, which is safe by accident rather
        # than by decision: adding a dependency that contributes an endpoint would publish it, and
        # /actuator/** is permitAll. Naming the three wanted here means nothing else can arrive
        # unannounced. See ADR-012.
        include: health,info,prometheus
  endpoint:
    health:
      # Splits /actuator/health into /liveness (is the process alive) and /readiness (can it serve).
      # A restart fixes the first and never the second, which is why an orchestrator needs both and
      # why the compose health-check polls readiness rather than the aggregate.
      probes:
        enabled: true
  metrics:
    tags:
      # Every *meter*. This is the one that reaches jvm.*, hikaricp.*, audit.events and
      # scheduled.job.runs; observations.key-values below does not, whatever its name suggests -
      # Boot's own metadata reads "applied to every observation", and only the meters derived from an
      # observation (http.server.requests) pick those up. Without this, scraping two deployments into
      # one target leaves every metric but the HTTP ones colliding unlabelled.
      application: ${spring.application.name}
  observations:
    key-values:
      # Kept as well as, not instead of: this is what tags the observations themselves, and therefore
      # the spans, which metrics.tags does not touch.
      application: ${spring.application.name}
  tracing:
    sampling:
      # Every request is sampled. The trace id reaches the log line either way - Micrometer writes the
      # MDC without consulting the sampler - but on an unsampled span every span.tag/span.error is
      # silently dropped, and with no exporter configured a lower rate saves nothing. Revisit when a
      # collector is added: this is the volume that would start leaving the process. See ADR-007.
      probability: 1.0
    propagation:
      # W3C only. Boot also consumes B3 and B3_MULTI by default, and the proxy clears the client's
      # traceparent, so a b3 header would be how a client chose the trace id the logs and the audit trail
      # join on (S5.C5, ADR-067). What is produced stays W3C, Boot's default.
      consume: W3C

logging:
  level:
    # INFO is what a deployment should run at: DEBUG is written for a developer reading along, and
    # this application's DEBUG lines fire per domain event - every minute, from dispatchReminders.
    # LOG_LEVEL_APP turns it up for one run without a code change. Everything outside this package
    # stays at Spring's default INFO, except the two loggers below.
    com.healthupgrades: ${LOG_LEVEL_APP:INFO}
    # The audit stream (ADR-011) is not under com.healthupgrades, so it follows the root level unless it
    # is pinned. Pinned, a root turned down to WARN cannot erase the trail while audit.events goes on
    # counting entries nobody wrote (S5.C9). Not configurable on purpose: an audit trail an operator can
    # switch off is not one.
    AUDIT: INFO
    # Hibernate writes the driver's message on every SQL failure, handled or not, and that message
    # quotes the row: a refused registration logged the email address (NFR-6, #142). A real fault still
    # reaches the log through the exception's own stack trace. Hibernate 7 writes it at WARN to this
    # category; Hibernate 6 wrote it at ERROR from org.hibernate.engine.jdbc.spi.SqlExceptionHelper
    # (ADR-032). Quoted so that it stays a level name: YAML reads a bare OFF as false, which Boot maps
    # back only by alias. See ADR-027.
    org.hibernate.orm.jdbc.error: "OFF"
