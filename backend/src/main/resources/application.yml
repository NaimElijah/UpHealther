server:
  port: 8080

spring:
  # Names the service in OpenTelemetry (service.name) and prefixes every log line. Without it a trace
  # is attributed to "unknown_service".
  application:
    name: health-upgrades-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthupgrades}
    username: ${DB_USERNAME:healthupgrades}
    password: ${DB_PASSWORD:healthupgrades}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities against it and refuses to start on a
      # mismatch. An entity change therefore needs a new V{n}__*.sql migration, never a schema update here.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # Lets Flyway adopt a database that already has tables but no schema history, so an environment
    # created before Flyway was introduced does not have to be dropped.
    baseline-on-migrate: true

app:
  jwt:
    # The fallback exists so a clone runs with no setup; it is a published value and gives no security.
    # Set JWT_SECRET in any deployment. At least 256 bits, or the application refuses to start.
    secret: ${JWT_SECRET:a-very-long-default-secret-key-that-should-be-changed-in-production-at-least-256-bits}
    expiration: 86400000 # 24h in milliseconds. Tokens are not refreshable, so this is the whole session.
  cors:
    # Comma-separated list of origins allowed to call the API directly (cross-origin).
    # Not needed when the frontend is served behind the Vite dev proxy or nginx (same-origin /api).
    # Also used as the allowed origins for the WebSocket (/ws) handshake.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  upgrades:
    schedules:
      # Cron expression for the scan that detects overdue upgrades (server timezone).
      # NOTIFY_OVERDUE_CRON is the name this job used before it moved to the upgrade context; it is still
      # honoured so an existing deployment does not silently lose its override and revert to the default.
      overdue: ${UPGRADE_OVERDUE_CRON:${NOTIFY_OVERDUE_CRON:0 0 8 * * *}} # daily at 08:00
  notifications:
    schedules:
      # Cron expressions for the delayed-notification jobs (server timezone).
      daily-checkin: ${NOTIFY_CHECKIN_CRON:0 0 18 * * *} # daily at 18:00 — check-in nudge
      reminders: ${NOTIFY_REMINDERS_CRON:0 * * * * *}    # every minute — user reminder dispatch

management:
  endpoints:
    web:
      exposure:
        # Explicit and closed. Boot's default exposes health alone, which is safe by accident rather
        # than by decision: adding a dependency that contributes an endpoint would publish it, and
        # /actuator/** is permitAll. Naming the three wanted here means nothing else can arrive
        # unannounced. See ADR-012.
        include: health,info,prometheus
  endpoint:
    health:
      # Splits /actuator/health into /liveness (is the process alive) and /readiness (can it serve).
      # A restart fixes the first and never the second, which is why an orchestrator needs both and
      # why the compose health-check polls readiness rather than the aggregate.
      probes:
        enabled: true
  observations:
    key-values:
      # Tags every metric and observation with the service, so two deployments are separable in one
      # scrape target without parsing anything.
      application: ${spring.application.name}
  tracing:
    sampling:
      # Every request is sampled. The trace id reaches the log line either way - Micrometer writes the
      # MDC without consulting the sampler - but on an unsampled span every span.tag/span.error is
      # silently dropped, and with no exporter configured a lower rate saves nothing. Revisit when a
      # collector is added: this is the volume that would start leaving the process. See ADR-007.
      probability: 1.0

logging:
  level:
    # INFO is what a deployment should run at: DEBUG is written for a developer reading along, and
    # this application's DEBUG lines fire per domain event - every minute, from dispatchReminders.
    # LOG_LEVEL_APP turns it up for one run without a code change. Everything outside this package
    # stays at Spring's default INFO.
    com.healthupgrades: ${LOG_LEVEL_APP:INFO}
