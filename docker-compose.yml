version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: healthupgrades-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthupgrades}
      POSTGRES_USER: ${POSTGRES_USER:-healthupgrades}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthupgrades}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthupgrades}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthupgrades

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthupgrades-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-healthupgrades}
      DB_USERNAME: ${POSTGRES_USER:-healthupgrades}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-healthupgrades}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-must-be-256-bits-long-random}
      # Shorten it to watch a token lapse and be renewed without the user noticing.
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      # How long a session survives unused, and the cap it never outlives however busy it is.
      AUTH_SESSION_IDLE: ${AUTH_SESSION_IDLE:-7d}
      AUTH_SESSION_ABSOLUTE: ${AUTH_SESSION_ABSOLUTE:-30d}
      # Default false because compose serves the stack over plain HTTP on localhost, and a Secure
      # cookie would simply never be sent back. Set it true anywhere with TLS, which is everywhere
      # else: without it the refresh credential travels in clear text.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # Promotes one existing account to ADMIN, once, while there is no administrator at all.
      ADMIN_BOOTSTRAP_USER_ID: ${ADMIN_BOOTSTRAP_USER_ID:-}
      # Which hop may set X-Forwarded-For and be believed — a Java regex, matching the static
      # address given to the frontend container below. Boot's default trusts 172.16/12, which
      # includes the Docker bridge gateway, so with the default anything reaching the published
      # :8080 directly could name whatever client address it liked and evade the rate limit.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172\.28\.0\.2}
      # Selects the JSON encoder in logback-spring.xml. A container's log is read by a machine before
      # a person, and `docker logs` is the only sink here - there is no file appender and no volume.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-json-logs}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      # Boot prints its banner straight to stdout before the logging system exists, so logback cannot
      # format it: nine unparseable lines ahead of every restart's JSON. Off here and nowhere else -
      # a local run still gets it, and there it is a person reading rather than a parser.
      SPRING_MAIN_BANNER_MODE: "off"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - healthupgrades
    # No healthcheck here: backend/Dockerfile declares one against the readiness probe and compose uses
    # the image's. Restating it gave two sources of truth for one probe, and they had already drifted
    # apart on the day they were written - the image said timeout 5s / 3 retries, this said 10s / 5.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthupgrades-frontend
    ports:
      - "3000:80"
    # As above: frontend/Dockerfile declares the probe.
    depends_on:
      # Waits for the API to be ready, not merely started. A plain depends_on let nginx come up while
      # Flyway was still migrating, so the first page load proxied to a backend that could not answer.
      backend:
        condition: service_healthy
    networks:
      healthupgrades:
        # Fixed, because the backend trusts this address by name. A container's address is
        # otherwise whatever the daemon hands out that day, and a trusted-proxy list that has to be
        # guessed is one somebody widens until it stops being a list.
        ipv4_address: 172.28.0.2

networks:
  healthupgrades:
    # Declared with its own subnet so the frontend can be pinned to a known address. The default
    # bridge assigns addresses per start, which is fine until something has to trust one.
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
